policy_profile: flat
policy_version: 1.0.5
code_paths:
  - "**/*.py"
  - "**/*.sh"
  - "scripts/**"
cli:
  - command: "python3 -m policy_check"
    help_args: ["--help"]
    reflected_in: "README.md"
    marker: "policy-check-help"
tier: shareable
secret_scan:
  allow:
    - "policy_check/rules/r21_secret_scan.py"
    - "tests/test_rule_r21_secret_scan.py"
    - "tests/fixtures/secret-scan/**"
    - "openspec/**"
    - "docs/**"
doc_reference:
  allow: []
agent_files:
  mode: symlink
conventions_engine:
  # 本 repo 即引擎本體，workflow 以 ./ 在地引用 → R-23 NA。
  # 下游 repo 在此填 hamanpaul/paulsha-conventions 以啟用 attestation。
  repo: ""
